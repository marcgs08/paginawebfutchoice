<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contáctanos - FutChoice</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Montserrat', sans-serif;
}

body{
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
    color:white;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:50px 0;
}

.logo-header{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    padding:20px 0;
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
    color:#2ecc71;
}

.logo-header img{
    width:60px;
    height:60px;
    object-fit:contain;
}

nav{
    display:flex;
    justify-content:center;
    gap:40px;
    padding:20px 0;
    border-bottom:1px solid #333;
}

nav a{
    text-decoration:none;
    color:#aaa;
    font-weight:600;
    transition:0.3s;
}

nav a:hover{
    color:#2ecc71;
}

.section{
    margin:40px auto;
    background:#181818;
    border-radius:20px;
    border:1px solid #2ecc71;
    box-shadow:0 0 20px rgba(46,204,113,0.5);
    padding:50px 30px;
}

h1{
    text-align:center;
    font-size:48px;
    font-weight:900;
    background: linear-gradient(90deg, #2ecc71, #00ff99);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:30px;
}

p{
    text-align:center;
    font-size:20px;
    line-height:1.8;
    color:#ccc;
}

@media(max-width:900px){

    nav{
        flex-wrap:wrap;
        gap:20px;
    }

    h1{
        font-size:36px;
    }

    p{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="logo-header">
    <img src="img/fclogo.png" alt="FutChoice Logo">
    <span>FUTCHOICE</span>
</header>

<nav>
    <a href="index.html">INICIO</a>
    <a href="quienes-somos.html">QUIÉNES SOMOS</a>
    <a href="contactanos.html">CONTÁCTANOS</a>
    <a href="politicas-privacidad.html">POLÍTICAS Y PRIVACIDAD</a>
</nav>

<section class="section">

    <h1>Contáctanos</h1>

    <p>
        ¿Quieres contratar el mejor fútbol al mejor precio?
        Contáctanos en futchoice@gmail.com
        o llama al +665489797.
    </p>

</section>

</div>

</body>
</html>
